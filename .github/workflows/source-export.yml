name: Source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=source-export.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: source-export.tar.gz
          if-no-files-found: error
          retention-days: 1
