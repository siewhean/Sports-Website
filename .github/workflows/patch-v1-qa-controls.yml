name: Patch V1 QA Controls

on:
  push:
    branches:
      - qa/v1-exact-capacity-full-placement-e2e
    paths:
      - .github/workflows/patch-v1-qa-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use the current time-zone select
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
            Path('apps/web/tests/v1-exact-capacity-full-placement-real.spec.ts'),
            Path('apps/web/tests/v1-competition-real-api.spec.ts'),
          ]
          for path in paths:
            text = path.read_text()
            old = 'getByLabel("Time zone").fill("Asia/Singapore")'
            new = 'getByLabel("Time zone").selectOption("Asia/Singapore")'
            if old not in text:
              raise SystemExit(f'Missing stale time-zone control in {path}')
            path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary patch workflow
        run: git rm .github/workflows/patch-v1-qa-controls.yml
      - name: Commit QA-only correction
        run: |
          git config user.name "matchday-v1-bot"
          git config user.email "65327039+siewhean@users.noreply.github.com"
          git add apps/web/tests .github/workflows
          git diff --cached --check
          git commit -m "test(v1): align real acceptance with time-zone select"
          git push origin HEAD:qa/v1-exact-capacity-full-placement-e2e
