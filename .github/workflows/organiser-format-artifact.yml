name: Organiser format artifact

on:
  push:
    branches:
      - feature/organiser-competition-library

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format organiser library helper
        run: pnpm exec prettier --write apps/web/lib/organiser-competition-library.server.ts
      - name: Upload formatted helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: organiser-library-prettier-output
          path: apps/web/lib/organiser-competition-library.server.ts
          if-no-files-found: error
