name: PR34 E2E Diagnostic

on:
  push:
    branches: [fix/v1-scheduler-results-publish]
  workflow_dispatch:

concurrency:
  group: pr34-e2e-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matchday/api openapi:generate
      - run: pnpm build
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - name: Web Playwright E2E
        id: web_e2e
        continue-on-error: true
        run: pnpm --filter @matchday/web test:e2e
      - name: Phase 4 real E2E
        id: phase4_real_e2e
        continue-on-error: true
        run: pnpm test:e2e:phase4:real
      - name: Report diagnostic result
        if: always()
        env:
          WEB_E2E_OUTCOME: ${{ steps.web_e2e.outcome }}
          PHASE4_REAL_E2E_OUTCOME: ${{ steps.phase4_real_e2e.outcome }}
        run: |
          echo "Web Playwright E2E: ${WEB_E2E_OUTCOME}"
          echo "Phase 4 real E2E: ${PHASE4_REAL_E2E_OUTCOME}"
          test "${WEB_E2E_OUTCOME}" = success
          test "${PHASE4_REAL_E2E_OUTCOME}" = success
