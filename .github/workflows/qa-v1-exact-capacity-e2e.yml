name: QA V1 Exact Capacity E2E

on:
  push:
    branches:
      - qa/v1-exact-capacity-full-placement-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PHASE4_E2E_JOURNEY: v1-competition
      PHASE4_E2E_PLAYWRIGHT_CONFIG: playwright.v1-exact-capacity.config.ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API workspace dependency closure
        run: pnpm --filter @matchday/api... build
      - name: Install Chromium
        run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - name: Run exact-capacity real-stack journey
        run: pnpm --filter @matchday/api exec tsx scripts/run-phase-4-real-e2e.ts

  completed-results-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PHASE4_E2E_JOURNEY: v1-competition
      PHASE4_E2E_PLAYWRIGHT_CONFIG: playwright.v1-competition-desktop.config.ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API workspace dependency closure
        run: pnpm --filter @matchday/api... build
      - name: Install Chromium
        run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - name: Run completed tournament results/publish journey
        run: pnpm --filter @matchday/api exec tsx scripts/run-phase-4-real-e2e.ts
