name: V1 Aggressive Acceptance

on:
  push:
    branches:
      - qa/v1-aggressive-acceptance-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      LOG_LEVEL: silent
      PHASE4_E2E_RUNS: 1
      PHASE4_E2E_PROJECT: phase-4-real-desktop-chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm dependencies:audit
      - name: Build real-stack API workspace dependency closure
        run: pnpm --filter @matchday/api... build
      - name: Run competition draft unit regression
        run: >-
          pnpm --filter @matchday/web exec vitest run
          lib/phase3-competition-draft.test.ts
          lib/phase3-competition-create.test.ts
      - name: Install Chromium
        run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - name: Run full V1 competition journey on desktop
        run: pnpm test:e2e:v1:competition:real
      - name: Run V1 setup schedule move journey on desktop
        run: pnpm test:e2e:v1:real
      - name: Final API and web builds
        run: |
          pnpm --filter @matchday/api build
          pnpm --filter @matchday/web build
