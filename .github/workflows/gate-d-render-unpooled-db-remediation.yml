name: Gate D Render unpooled DB remediation

on:
  push:
    branches: [gate-d/control-f1a82186]
    paths:
      - .github/workflows/gate-d-render-unpooled-db-remediation.yml
      - .github/gate-d/render-db-url-unpooled.sealed.json
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gate-d-render-unpooled-db-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Wire unpooled Gate D Neon endpoint into Render
    runs-on: ubuntu-latest
    environment: gate-d-controlled-staging
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: f1a8218616f51197a22fe218306ae6f7a908efca
      RENDER_SERVICE_ID: srv-dabbmk2jobas73c0de20
      TARGET_URL: https://c5-drill.poladex.shop
      EXPECTED_DB_HOST: ep-raspy-mud-a1og3bh8.ap-southeast-1.aws.neon.tech
      EXPECTED_DB_ROLE: gate_d_runtime
      EXPECTED_DB_NAME: neondb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gate-d/control-f1a82186
          fetch-depth: 0
          persist-credentials: false

      - name: Prove frozen candidate unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase-7/release-hardening
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"

      - name: Decrypt and validate sealed unpooled database URL
        id: bridge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createHash, createPrivateKey, createPublicKey, diffieHellman, hkdfSync, createDecipheriv } from "node:crypto";

          const seed = createHash("sha256")
            .update("matchday-gate-d-render-bridge-v1")
            .update("\0")
            .update(process.env.RENDER_API_KEY)
            .digest();
          const privateKey = createPrivateKey({
            key: Buffer.concat([Buffer.from("302e020100300506032b656e04220420", "hex"), seed]),
            format: "der",
            type: "pkcs8",
          });
          const publicRaw = Buffer.from(createPublicKey(privateKey).export({ format: "der", type: "spki" })).subarray(-32);
          console.log(`BRIDGE_PUBLIC_KEY_B64=${publicRaw.toString("base64")}`);

          const path = ".github/gate-d/render-db-url-unpooled.sealed.json";
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_payload=false\n");
            console.log("No unpooled sealed payload present; no mutation performed");
            process.exit(0);
          }
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          const ephemeralRaw = Buffer.from(payload.ephemeral_public_key_b64, "base64");
          const ephemeralPublicKey = createPublicKey({
            key: Buffer.concat([Buffer.from("302a300506032b656e032100", "hex"), ephemeralRaw]),
            format: "der",
            type: "spki",
          });
          const shared = diffieHellman({ privateKey, publicKey: ephemeralPublicKey });
          const key = Buffer.from(hkdfSync("sha256", shared, Buffer.alloc(0), Buffer.from("matchday-gate-d-render-db-v1"), 32));
          const decipher = createDecipheriv("aes-256-gcm", key, Buffer.from(payload.iv_b64, "base64"));
          decipher.setAuthTag(Buffer.from(payload.tag_b64, "base64"));
          const plaintext = Buffer.concat([
            decipher.update(Buffer.from(payload.ciphertext_b64, "base64")),
            decipher.final(),
          ]).toString("utf8");
          const url = new URL(plaintext);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) throw new Error("decrypted payload is not PostgreSQL");
          if (url.hostname !== process.env.EXPECTED_DB_HOST) throw new Error(`unexpected database host ${url.hostname}`);
          if (decodeURIComponent(url.username) !== process.env.EXPECTED_DB_ROLE) throw new Error("unexpected database role");
          if (url.pathname !== `/${process.env.EXPECTED_DB_NAME}`) throw new Error("unexpected database name");
          if (!url.password) throw new Error("database payload has no password");
          console.log(`::add-mask::${plaintext}`);
          console.log(`::add-mask::${url.password}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `REPLACEMENT_DATABASE_URL=${plaintext}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_payload=true\n");
          console.log("Decrypted and validated unpooled Gate D database URL in runner memory");
          NODE

      - name: Verify unpooled database exactly as application probe does
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gate-d-unpooled-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$work" && mkdir -p "$work" && cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --silent postgres@3.4.9
          DATABASE_URL="$REPLACEMENT_DATABASE_URL" node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { connect_timeout: 2, max: 1 });
          try {
            const rows = await sql`SELECT 1 AS ok`;
            if (rows[0]?.ok !== 1) throw new Error("application-equivalent database probe did not return 1");
            console.log("Application-equivalent 2-second database probe passed on unpooled endpoint");
          } finally {
            await sql.end({ timeout: 1 });
          }
          NODE

      - name: Update only Render DATABASE_URL to unpooled endpoint
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          payload="$(REPLACEMENT_DATABASE_URL="$REPLACEMENT_DATABASE_URL" node -e 'process.stdout.write(JSON.stringify({value: process.env.REPLACEMENT_DATABASE_URL}))')"
          curl --fail --silent --show-error -X PUT \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/DATABASE_URL" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
          echo "Updated Gate D Render DATABASE_URL to verified unpooled Neon endpoint"

      - name: Redeploy Render service
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')"
          deploy_id="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const j=JSON.parse(s);const id=j.id||j.deploy?.id;if(!id)process.exit(2);process.stdout.write(id)})')"
          echo "Triggered Gate D deploy $deploy_id"
          for attempt in $(seq 1 120); do
            status_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(printf '%s' "$status_json" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.status||j.deploy?.status||"unknown")})')"
            echo "Deploy status: $status ($attempt/120)"
            case "$status" in live) break ;; build_failed|update_failed|canceled|deactivated) exit 1 ;; esac
            if [ "$attempt" -eq 120 ]; then exit 1; fi
            sleep 5
          done

      - name: Prove exact-SHA deployed readiness
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          for (let attempt = 1; attempt <= 48; attempt++) {
            try {
              const [metaRes, readyRes] = await Promise.all([
                fetch(`${base}/api/v1/meta/build`, { signal: AbortSignal.timeout(15000) }),
                fetch(`${base}/health/ready`, { signal: AbortSignal.timeout(15000) }),
              ]);
              if (metaRes.ok && readyRes.ok) {
                const meta = await metaRes.json();
                const ready = await readyRes.json();
                if (meta.git_sha === process.env.CANDIDATE_SHA && meta.environment === "staging" &&
                    ready.dependencies?.database && ready.dependencies?.redis && ready.dependencies?.queue) {
                  console.log(`Verified exact-SHA Gate D readiness on ${meta.git_sha}`);
                  process.exit(0);
                }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error("Gate D endpoint did not become healthy after unpooled database remediation");
          NODE
