name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      certify_launch_images:
        description: Build and publish exact-SHA ARM64 images for the isolated launch integration branch (no latest tag or deployment)
        type: boolean
        default: false
      generate_linux_visual_baselines:
        description: Generate linux visual baselines and upload them as an artifact (does not commit anything)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the repository for secrets
        run: bash scripts/scan-secrets.sh

  quality-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:assert-clean-outputs
      - run: pnpm test:guard
      - run: RELEASE_PHASE=A node scripts/release-suite-guard.mjs
      - name: Rollback, deployment freeze, backup and workflow safety regressions
        run: node --test infra/oci/deploy-prod.test.mjs infra/oci/deployment-freeze-policy.test.mjs infra/oci/backup/backup.test.mjs scripts/launch-ci-contract.test.mjs
      - name: Require isolated Docker-backed Caddy mount verification
        run: MATCHDAY_REQUIRE_DOCKER_CADDY_TEST=1 node --test infra/oci/caddy-mount-visibility.test.mjs
      - name: Canonical production dependency security assurance
        run: pnpm dependencies:audit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secrets]
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matchday/config build
      - run: pnpm db:migrate:check
      - run: BACKUP_VERIFY_MODE=direct BACKUP_VERIFY_ADMIN_DATABASE_URL=postgres://matchday:matchday@127.0.0.1:5432/postgres BACKUP_VERIFY_DIRECT_CLIENT_IMAGE=postgres:18.4-alpine pnpm backup:verify
      - run: pnpm test:integration
      - run: pnpm validate:fixtures
      - run: pnpm --filter @matchday/api openapi:generate
      - run: pnpm openapi:check

  browser-e2e:
    name: browser-e2e (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality-fast]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Release-artifact verification is identical for every shard, so it runs once.
      - run: pnpm deploy:manifest
        if: matrix.shard == '1/2'
      - run: pnpm asset-delivery:verify:origin
        if: matrix.shard == '1/2'
        timeout-minutes: 5
      - name: Verify release artifact inputs
        if: matrix.shard == '1/2'
        run: |
          pnpm --filter @matchday/api openapi:generate
          pnpm openapi:check
          test -s apps/api/openapi.generated.json
          test -s artifacts/deployment-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.shard == '1/2'
        with:
          name: verified-contracts-and-deployment
          path: |
            apps/api/openapi.generated.json
            artifacts/deployment-manifest.json
          if-no-files-found: error
      # Engines used by the Playwright projects: chromium + webkit (default config) and firefox
      # (phase-4 real-API journey, playwright.phase4-real.config.ts desktop-firefox project).
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e --shard=${{ matrix.shard }}
      - run: pnpm test:a11y --shard=${{ matrix.shard }}
      # NON-REQUIRED: visual baselines are macOS (darwin) only. This step is informational until linux baselines are
      # committed (generate them with the "generate_linux_visual_baselines" manual run). It never rewrites snapshots.
      - name: Visual regression (non-required, needs committed linux baselines)
        if: matrix.shard == '1/2'
        continue-on-error: true
        run: |
          if ! find apps/web/tests -name '*-linux.png' | grep -q .; then
            echo "::notice::No linux visual baselines are committed; skipping visual regression (see docs/operations/CI_AND_RELEASES.md)."
            exit 0
          fi
          pnpm test:visual

  gate-d-real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secrets, quality-fast, integration]
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:phase7:real

  visual-baselines:
    # Manual only: produces linux baselines as a downloadable artifact for a human to review and commit.
    if: github.event_name == 'workflow_dispatch' && inputs.generate_linux_visual_baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium webkit
      - name: Generate linux baselines
        run: pnpm --filter @matchday/web exec env -u NO_COLOR playwright test --grep 'visual baseline(s)?' --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-linux
          path: apps/web/tests/**/*-linux.png
          if-no-files-found: error

  images:
    # Builds the api/web/worker/migrate/backup images once, in CI, and pushes them to GHCR tagged with the git SHA.
    # infra/oci/deploy-prod.sh pulls these exact tags; nothing is compiled on the production VM.
    name: images (${{ matrix.target }})
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.certify_launch_images &&
      github.ref == 'refs/heads/codex/launch-integration-certification')
    needs: [quality-fast, integration]
    # The production OCI VM is arm64 (Ampere), so images are built natively on GitHub's arm64 runners.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: api, context: ., file: infra/oci/Dockerfile }
          - { target: web, context: ., file: infra/oci/Dockerfile }
          - { target: worker, context: ., file: infra/oci/Dockerfile }
          - { target: migrate, context: ., file: infra/oci/Dockerfile }
          - { target: backup, context: infra/oci/backup, file: infra/oci/backup/Dockerfile }
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image name, tags and build timestamp
        id: meta
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/matchday-${{ matrix.target }}"
          tags="${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo "image=${image}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Require the public web build variables
        if: matrix.target == 'web'
        env:
          MATCHDAY_PUBLIC_ORIGIN: ${{ vars.MATCHDAY_PUBLIC_ORIGIN }}
        run: |
          if [ -z "$MATCHDAY_PUBLIC_ORIGIN" ]; then
            echo "::error::Set the MATCHDAY_PUBLIC_ORIGIN repository variable (e.g. https://matchday.example.com) before building the web image."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Only the main Dockerfile has per-service stages; the backup image is a single-stage build.
          target: ${{ matrix.target != 'backup' && matrix.target || '' }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            MATCHDAY_BUILD_ID=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
            MATCHDAY_PUBLIC_ORIGIN=${{ vars.MATCHDAY_PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MATCHDAY_API_BASE_URL=${{ vars.NEXT_PUBLIC_MATCHDAY_API_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=matchday-images-${{ matrix.target }}-arm64
          cache-to: type=gha,scope=matchday-images-${{ matrix.target }}-arm64,mode=max
      - name: Record digest
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${GITHUB_SHA}"
            echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record exact image provenance
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts/images
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; const e = process.env; if (!/^sha256:[a-f0-9]{64}$/.test(e.IMAGE_DIGEST)) throw new Error("Missing image digest"); writeFileSync(`artifacts/images/${e.IMAGE_TARGET}.json`, JSON.stringify({ source_sha: e.GITHUB_SHA, workflow_run_id: e.GITHUB_RUN_ID, workflow_run_attempt: e.GITHUB_RUN_ATTEMPT, target: e.IMAGE_TARGET, platform: "linux/arm64", image: `${e.IMAGE_NAME}:${e.GITHUB_SHA}`, digest: e.IMAGE_DIGEST }, null, 2) + "\n");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-provenance-${{ matrix.target }}
          path: artifacts/images/${{ matrix.target }}.json
          if-no-files-found: error
