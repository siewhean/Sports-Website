name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      MAILPIT_API_URL: http://127.0.0.1:8025
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
    steps:
      - name: Check out the Phase 4 feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase4-organiser-draft-persistence
          fetch-depth: 0

      - name: Apply the reviewed Phase 4 patch series
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base64 --decode .automation/phase4/patches.tgz.b64 > "$workdir/patches.tgz"
          mkdir -p "$workdir/patches"
          tar -xzf "$workdir/patches.tgz" -C "$workdir/patches"

          while IFS= read -r patch; do
            test -n "$patch"
            git apply --check "$workdir/patches/$patch"
            git apply "$workdir/patches/$patch"
          done < "$workdir/patches/series"

          rm -rf .automation/phase4
          rm -f .github/workflows/apply-phase4-patches.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:assert-clean-outputs
      - run: pnpm dependencies:audit
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm db:migrate:check
      - run: pnpm backup:verify
      - run: pnpm test:integration
      - run: pnpm validate:fixtures
      - run: pnpm openapi:check
      - run: pnpm build
      - run: pnpm deploy:manifest
      - run: pnpm asset-delivery:verify:origin
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: artifacts/deployment-manifest.json
          if-no-files-found: error
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm test:visual

      - name: Commit the verified implementation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist organiser format revisions"
          git push origin HEAD:agent/phase4-organiser-draft-persistence

  secrets:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-organiser-draft-persistence
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
