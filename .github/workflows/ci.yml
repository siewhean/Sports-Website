name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-reviewed-phase4-patches:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Phase 4 feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase4-organiser-draft-persistence
          fetch-depth: 0

      - name: Apply the reviewed patch series
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base64 --decode .automation/phase4/patches.tgz.b64 > "$workdir/patches.tgz"
          mkdir -p "$workdir/patches"
          tar -xzf "$workdir/patches.tgz" -C "$workdir/patches"

          while IFS= read -r patch; do
            test -n "$patch"
            git apply --check "$workdir/patches/$patch"
            git apply "$workdir/patches/$patch"
          done < "$workdir/patches/series"

          rm -rf .automation/phase4
          rm -f .github/workflows/apply-phase4-patches.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - name: Commit the implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist organiser format revisions"
          git push origin HEAD:agent/phase4-organiser-draft-persistence
