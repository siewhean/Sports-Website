name: Tournament Simulation Harness

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/scheduler/**"
      - "packages/domain/**"
      - "packages/database/**"
      - ".github/workflows/tournament-simulation.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/scheduler/**"
      - "packages/domain/**"
      - "packages/database/**"
      - ".github/workflows/tournament-simulation.yml"
  schedule:
    # Nightly full tournament simulation at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Simulation profile (fast or full)"
        type: choice
        options:
          - fast
          - full
        default: fast

concurrency:
  group: tournament-sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: matchday
          POSTGRES_PASSWORD: matchday
          POSTGRES_INITDB_ARGS: "--locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchday -d matchday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://matchday:matchday@127.0.0.1:5432/matchday
      REDIS_URL: redis://127.0.0.1:6379
      RUN_INFRA_TESTS: "1"
      LOG_LEVEL: silent
      NO_COLOR: "1"
      SCORING_ACCESS_RATE_LIMIT_HMAC_KEYRING: '{"primary":{"version":"v1","secret":"test-keyring-secret-32-chars-minimum-length"},"verificationOnly":[]}'
      SCORING_ACCESS_RATE_LIMIT_LEGACY_V1_MATERIAL_COMMITMENT: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all workspace packages
        run: pnpm build
      - name: Run fast simulation (PR / push)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm simulate:tournament:fast
      - name: Run full simulation (Nightly schedule)
        if: github.event_name == 'schedule'
        run: pnpm simulate:tournament
      - name: Run manual dispatch simulation
        if: github.event_name == 'workflow_dispatch'
        run: pnpm simulate:tournament --profile=${{ inputs.profile }}
