name: Gate D database remediation

on:
  push:
    branches: [gate-d/control-f1a82186]
    paths:
      - .github/workflows/gate-d-db-remediation.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  database-remediation:
    name: Wire replacement Gate D Neon branch into Render
    runs-on: ubuntu-latest
    environment: gate-d-controlled-staging
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: f1a8218616f51197a22fe218306ae6f7a908efca
      NEON_PROJECT_ID: twilight-shadow-19787996
      NEON_BRANCH_ID: br-steep-bonus-a14c4r0i
      NEON_DATABASE_NAME: neondb
      NEON_ROLE_NAME: gate_d_runtime
      RENDER_SERVICE_ID: srv-dabbmk2jobas73c0de20
      TARGET_URL: https://c5-drill.poladex.shop

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove frozen candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin phase-7/release-hardening
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"

      - name: Retrieve replacement Neon connection without exposing it
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"

          query="branch_id=$NEON_BRANCH_ID&database_name=$NEON_DATABASE_NAME&role_name=$NEON_ROLE_NAME&pooled=true"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H 'Accept: application/json' \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?$query")"

          database_url="$(printf '%s' "$response" | node --input-type=module -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              const seen = new Set();
              function find(node) {
                if (typeof node === "string" && /^postgres(?:ql)?:\/\//.test(node)) return node;
                if (!node || typeof node !== "object" || seen.has(node)) return null;
                seen.add(node);
                for (const value of Object.values(node)) {
                  const found = find(value);
                  if (found) return found;
                }
                return null;
              }
              const value = find(data);
              if (!value) process.exit(2);
              process.stdout.write(value);
            });
          ')"

          test -n "$database_url"
          echo "::add-mask::$database_url"
          printf 'REPLACEMENT_DATABASE_URL=%s\n' "$database_url" >> "$GITHUB_ENV"
          echo "Retrieved replacement Gate D database connection for branch $NEON_BRANCH_ID"

      - name: Verify replacement database authentication
        run: |
          set -euo pipefail
          npm install --global postgres@3.4.9 >/dev/null 2>&1
          DATABASE_URL="${REPLACEMENT_DATABASE_URL//-pooler/}" node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { ssl: "require", max: 1, connect_timeout: 10 });
          try {
            const rows = await sql`select count(*)::int as migration_count, max(name) as last_migration from schema_migrations`;
            const row = rows[0];
            if (row.migration_count !== 61 || row.last_migration !== "0061_phase6_reject_organisation_event_pass.sql") {
              throw new Error(`replacement database migration mismatch: ${JSON.stringify(row)}`);
            }
            console.log("Verified replacement database: 61 migrations through 0061");
          } finally {
            await sql.end({ timeout: 2 });
          }
          NODE

      - name: Update only Gate D Render DATABASE_URL
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          test -n "$REPLACEMENT_DATABASE_URL"
          payload="$(REPLACEMENT_DATABASE_URL="$REPLACEMENT_DATABASE_URL" node -e 'process.stdout.write(JSON.stringify({value: process.env.REPLACEMENT_DATABASE_URL}))')"
          curl --fail --silent --show-error -X PUT \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/DATABASE_URL" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
          echo "Updated Gate D Render DATABASE_URL without exposing the credential"

      - name: Redeploy Gate D Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')"
          deploy_id="$(printf '%s' "$response" | node -e '
            let raw=""; process.stdin.on("data",c=>raw+=c); process.stdin.on("end",()=>{
              const j=JSON.parse(raw); const id=j.id||j.deploy?.id; if(!id) process.exit(2); process.stdout.write(id);
            });
          ')"
          echo "Triggered Gate D deploy $deploy_id"

          for attempt in $(seq 1 90); do
            status_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(printf '%s' "$status_json" | node -e '
              let raw=""; process.stdin.on("data",c=>raw+=c); process.stdin.on("end",()=>{
                const j=JSON.parse(raw); process.stdout.write(j.status||j.deploy?.status||"unknown");
              });
            ')"
            echo "Deploy status: $status ($attempt/90)"
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            if [ "$attempt" -eq 90 ]; then echo "Timed out waiting for Gate D deploy" >&2; exit 1; fi
            sleep 5
          done

      - name: Verify controlled endpoint exact SHA and readiness
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          let meta, ready;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const metaRes = await fetch(`${base}/api/v1/meta/build`, { signal: AbortSignal.timeout(15000) });
              const readyRes = await fetch(`${base}/health/ready`, { signal: AbortSignal.timeout(15000) });
              if (metaRes.ok && readyRes.ok) {
                meta = await metaRes.json();
                ready = await readyRes.json();
                if (meta.git_sha === process.env.CANDIDATE_SHA && meta.environment === "staging" &&
                    ready.dependencies?.database && ready.dependencies?.redis && ready.dependencies?.queue) break;
              }
            } catch {}
            meta = undefined; ready = undefined;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!meta || !ready) throw new Error("controlled endpoint did not become exact-SHA healthy after remediation");
          console.log(`Verified controlled staging endpoint on ${meta.git_sha}: database/redis/queue healthy`);
          NODE
