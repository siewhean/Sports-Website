name: Gate D integrate scoring lock guard

on:
  push:
    branches:
      - gate-d/integrate-lock-guard

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release-hardening
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-7/release-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Gate D settings-lock guard
        shell: bash
        run: |
          set -euo pipefail
          expected='84143a26544f5fea61ed7d1cbe1acb69e8db8632'
          test "$(git rev-parse HEAD)" = "$expected"
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/phase-2-runtime.ts')
          text = path.read_text()
          old = '''           locked_settings AS (
             UPDATE competition_sport_settings
             SET locked_at=COALESCE(locked_at,$15)
             WHERE competition_id=$2 AND $16::boolean
           ),'''
          new = '''           locked_settings AS (
             UPDATE competition_sport_settings
             SET locked_at=$15
             WHERE competition_id=$2 AND locked_at IS NULL AND $16::boolean
           ),'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one settings-lock CTE, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- apps/api/src/phase-2-runtime.ts

      - name: Commit exact integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/phase-2-runtime.ts
          test "$(git diff --cached --name-only)" = 'apps/api/src/phase-2-runtime.ts'
          git commit -m 'perf(scoring): guard competition settings lock update'
          git push origin HEAD:phase-7/release-hardening
