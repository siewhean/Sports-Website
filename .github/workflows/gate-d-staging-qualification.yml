name: Gate D controlled staging qualification

on:
  push:
    branches: [gate-d/control-f1a82186]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [phase-7/release-hardening]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character Gate D candidate SHA
        required: true
        type: string
      target_url:
        description: Exact controlled-staging API base URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gate-d-controlled-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staging-qualification:
    name: Gate D controlled staging receipts
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, gate-c-staging]
    environment: gate-d-controlled-staging
    timeout-minutes: 120
    env:
      APP_ENV: staging
      CANDIDATE_SHA: ${{ github.event_name == 'push' && 'f1a8218616f51197a22fe218306ae6f7a908efca' || inputs.candidate_sha || github.event.workflow_run.head_sha }}
      TARGET_URL: ${{ inputs.target_url || vars.GATE_D_TARGET_URL || 'https://c5-staging.poladex.shop' }}
      DATABASE_URL: ${{ secrets.GATE_D_DATABASE_URL }}
      REDIS_URL: ${{ secrets.GATE_D_REDIS_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable Gate D candidate checkout
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin phase-7/release-hardening
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate isolated staging inputs
        run: |
          set -euo pipefail
          test -n "$TARGET_URL"
          test -n "$DATABASE_URL"
          test -n "$REDIS_URL"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.TARGET_URL);
          if (url.protocol !== "https:") throw new Error("Gate D TARGET_URL must use HTTPS");
          if (url.username || url.password || url.search || url.hash) {
            throw new Error("Gate D TARGET_URL must not contain credentials, query, or fragment");
          }
          for (const [name, value] of [["DATABASE_URL", process.env.DATABASE_URL], ["REDIS_URL", process.env.REDIS_URL]]) {
            const parsed = new URL(value);
            if (name === "DATABASE_URL" && !["postgres:", "postgresql:"].includes(parsed.protocol)) {
              throw new Error("GATE_D_DATABASE_URL must be PostgreSQL");
            }
            if (name === "REDIS_URL" && !["redis:", "rediss:"].includes(parsed.protocol)) {
              throw new Error("GATE_D_REDIS_URL must be Redis");
            }
          }
          NODE

      - name: Prepare runner-owned Gate D temp root
        run: |
          set -euo pipefail
          runtime_tmp="$RUNNER_TEMP/matchday-gate-d-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$runtime_tmp"
          mkdir -p "$runtime_tmp"
          printf 'TMPDIR=%s\n' "$runtime_tmp" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify deployed API exact SHA
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          const response = await fetch(`${base}/api/v1/meta/build`, { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Build metadata returned HTTP ${response.status}`);
          const body = await response.json();
          if (body.git_sha !== process.env.CANDIDATE_SHA) {
            throw new Error(`Deployed SHA mismatch: expected ${process.env.CANDIDATE_SHA}, got ${body.git_sha}`);
          }
          if (body.environment !== "staging") {
            throw new Error(`Gate D requires deployed APP_ENV=staging; got ${body.environment}`);
          }
          console.log(`Verified deployed staging SHA ${body.git_sha}`);
          NODE

      - name: Validate migration compatibility against Gate D database
        run: pnpm db:migrate:check

      - name: Seed canonical Gate D pilot fixture
        run: pnpm seed:staging:pilot

      - name: Locate single-use scoring handoff
        id: scoring-handoff
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$TMPDIR" -maxdepth 2 -type f -path "$TMPDIR/matchday-gate-d-scoring-*/scorekeeper-access.json" -print)
          test "${#files[@]}" -eq 1
          secret_file="${files[0]}"
          test "$(stat -c '%a' "$secret_file")" = "600"
          case "$secret_file" in
            "$TMPDIR"/matchday-gate-d-scoring-*/scorekeeper-access.json) ;;
            *) echo 'Scoring handoff escaped runner-owned Gate D temp root' >&2; exit 1 ;;
          esac
          printf 'secret_file=%s\n' "$secret_file" >> "$GITHUB_OUTPUT"
          printf 'secret_dir=%s\n' "$(dirname "$secret_file")" >> "$GITHUB_OUTPUT"

      - name: Run QA-010 public projection staging load
        run: pnpm test:load:public -- --mode=staging

      - name: Run QA-011 scoring and result propagation staging load
        env:
          GATE_D_SCORING_SECRET_FILE: ${{ steps.scoring-handoff.outputs.secret_file }}
        run: pnpm test:load:scoring -- --mode=staging

      - name: Prove one-time scoring handoff was destroyed by QA-011
        run: |
          set -euo pipefail
          test ! -e '${{ steps.scoring-handoff.outputs.secret_file }}'
          test ! -d '${{ steps.scoring-handoff.outputs.secret_dir }}'

      - name: Verify all Gate D staging receipts
        run: pnpm evidence:gate-d:verify "$CANDIDATE_SHA"

      - name: Prove qualification did not mutate tracked source
        run: git diff --exit-code

      - name: Unconditionally destroy runner-owned Gate D temp data
        if: ${{ always() }}
        run: |
          set +e
          secret_file='${{ steps.scoring-handoff.outputs.secret_file }}'
          secret_dir='${{ steps.scoring-handoff.outputs.secret_dir }}'
          if [ -n "$secret_file" ]; then rm -f -- "$secret_file"; fi
          if [ -n "$secret_dir" ]; then rm -rf -- "$secret_dir"; fi
          if [ -n "${TMPDIR:-}" ] && [[ "$TMPDIR" == "$RUNNER_TEMP"/matchday-gate-d-runtime-* ]]; then
            rm -rf -- "$TMPDIR"
          fi

      - name: Retain non-secret Gate D staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-d-staging-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/staging-pilot-seed.json
            artifacts/qa-010-load-public-summary.json
            artifacts/qa-011-load-scoring-summary.json
            artifacts/qa-011-result-propagation-summary.json
          if-no-files-found: warn
          retention-days: 90
