name: Gate D controlled staging qualification

on:
  push:
    branches: [gate-d/control-f1a82186]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-d-controlled-staging
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  staging-qualification:
    name: Gate D controlled staging receipts
    runs-on: ubuntu-latest
    environment: gate-d-controlled-staging
    timeout-minutes: 120
    env:
      APP_ENV: staging
      CANDIDATE_SHA: f1a8218616f51197a22fe218306ae6f7a908efca
      TARGET_URL: https://gate-d-api.poladex.shop
      DATABASE_URL: ${{ secrets.GATE_D_DATABASE_URL }}
      REDIS_URL: ${{ secrets.GATE_D_REDIS_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable Gate D candidate checkout
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin phase-7/release-hardening
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate frozen staging inputs
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$REDIS_URL"
          node --input-type=module <<'NODE'
          const target = new URL(process.env.TARGET_URL);
          if (target.protocol !== "https:") throw new Error("Gate D TARGET_URL must use HTTPS");
          if (target.origin !== "https://gate-d-api.poladex.shop" || !["/", ""].includes(target.pathname)) {
            throw new Error(`Gate D qualification target is frozen to https://gate-d-api.poladex.shop; got ${target.origin}${target.pathname}`);
          }
          if (target.username || target.password || target.search || target.hash) {
            throw new Error("Gate D TARGET_URL must not contain credentials, query, or fragment");
          }
          const database = new URL(process.env.DATABASE_URL);
          if (!["postgres:", "postgresql:"].includes(database.protocol)) {
            throw new Error("GATE_D_DATABASE_URL must be PostgreSQL");
          }
          const redis = new URL(process.env.REDIS_URL);
          if (!["redis:", "rediss:"].includes(redis.protocol)) {
            throw new Error("GATE_D_REDIS_URL must be Redis");
          }
          NODE

      - name: Prepare runner-owned Gate D temp root
        run: |
          set -euo pipefail
          runtime_tmp="$RUNNER_TEMP/matchday-gate-d-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$runtime_tmp"
          mkdir -p "$runtime_tmp"
          printf 'TMPDIR=%s\n' "$runtime_tmp" >> "$GITHUB_ENV"
          printf 'DATABASE_URL=%s\n' "${DATABASE_URL//-pooler/}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Resolve canonical deployed database credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          # Prefer the protected GitHub environment secret when it is current.
          if pnpm --filter @matchday/api exec node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { ssl: "require", max: 1, connect_timeout: 10 });
          try {
            await sql`select 1 as ok`;
          } finally {
            await sql.end({ timeout: 2 }).catch(() => {});
          }
          NODE
          then
            echo "Protected Gate D database credential is current"
            exit 0
          fi

          # The protected secret can become stale after a Neon password rotation. In that
          # case, recover only the DATABASE_URL already configured on the deployed Gate D
          # Render service. Never print the API response or credential.
          test -n "${RENDER_API_KEY:-}"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            'https://api.render.com/v1/services/srv-dabbmk2jobas73c0de20/env-vars/DATABASE_URL')"

          live_database_url="$(printf '%s' "$response" | node --input-type=module -e '
            let raw = "";
            process.stdin.on("data", (chunk) => raw += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              const seen = new Set();
              function find(node) {
                if (!node || typeof node !== "object" || seen.has(node)) return null;
                seen.add(node);
                if (typeof node.value === "string" && (node.key === "DATABASE_URL" || node.name === "DATABASE_URL")) return node.value;
                if (typeof node.value === "string" && Object.keys(node).length <= 3) return node.value;
                for (const value of Object.values(node)) {
                  const found = find(value);
                  if (found) return found;
                }
                return null;
              }
              const value = find(data);
              if (!value) process.exit(2);
              process.stdout.write(value);
            });
          ')"

          test -n "$live_database_url"
          case "$live_database_url" in
            postgres://*|postgresql://*) ;;
            *) echo 'Render DATABASE_URL is not PostgreSQL' >&2; exit 1 ;;
          esac

          echo "::add-mask::$live_database_url"
          live_database_url="${live_database_url//-pooler/}"
          echo "::add-mask::$live_database_url"
          printf 'DATABASE_URL=%s\n' "$live_database_url" >> "$GITHUB_ENV"

          DATABASE_URL="$live_database_url" pnpm --filter @matchday/api exec node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { ssl: "require", max: 1, connect_timeout: 10 });
          try {
            await sql`select 1 as ok`;
            console.log("Recovered and verified the deployed Gate D database credential without exposing it");
          } finally {
            await sql.end({ timeout: 2 });
          }
          NODE

      - name: Fail-closed database and Redis connectivity preflight
        run: |
          set -euo pipefail
          pnpm --filter @matchday/api exec node --input-type=module <<'NODE'
          import postgres from "postgres";
          import { createClient } from "redis";

          const failures = [];

          const redis = createClient({ url: process.env.REDIS_URL });
          redis.on("error", () => {});
          try {
            await redis.connect();
            const pong = await redis.ping();
            if (pong !== "PONG") throw new Error(`unexpected PING response ${pong}`);

            let policy;
            try {
              const info = await redis.sendCommand(["INFO", "memory"]);
              const match = String(info).match(/^maxmemory_policy:(.+)$/m);
              policy = match?.[1]?.trim();
            } catch {}
            if (!policy) {
              try {
                const result = await redis.sendCommand(["CONFIG", "GET", "maxmemory-policy"]);
                if (Array.isArray(result)) policy = String(result.at(-1) ?? "").trim();
                else if (result && typeof result === "object") policy = String(result["maxmemory-policy"] ?? "").trim();
              } catch {}
            }
            if (policy && policy !== "noeviction") {
              console.warn(`::warning::Gate D Redis maxmemory policy is ${policy}; noeviction is recommended for BullMQ/lease reliability but is not a Gate D exit criterion`);
            }
            console.log(`Verified isolated Redis connectivity${policy ? ` (policy: ${policy})` : ""}`);
          } catch (error) {
            failures.push(`Redis preflight failed: ${error instanceof Error ? error.message : String(error)}`);
          } finally {
            if (redis.isOpen) await redis.quit().catch(() => redis.disconnect());
          }

          const sql = postgres(process.env.DATABASE_URL, { ssl: "require", max: 1, connect_timeout: 10 });
          try {
            await sql`select 1 as ok`;
            console.log("Verified isolated PostgreSQL authentication and connectivity");
          } catch (error) {
            failures.push(`Database preflight failed: ${error instanceof Error ? error.message : String(error)}`);
          } finally {
            await sql.end({ timeout: 2 }).catch(() => {});
          }

          if (failures.length) {
            throw new Error(failures.join(" | "));
          }
          NODE

      - name: Seed HMAC keyring versions in isolated database
        run: |
          set -euo pipefail
          pnpm --filter @matchday/api exec node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { ssl: "require" });
          try {
            await sql`
              INSERT INTO scoring_fallback_code_hmac_key_versions (
                key_version, material_commitment, status
              ) VALUES (
                'v1', decode(repeat('00', 32), 'hex'), 'primary'
              ) ON CONFLICT (key_version) DO NOTHING
            `;
            await sql`
              INSERT INTO scoring_access_hmac_key_versions (
                key_version, material_commitment, status
              ) VALUES (
                'v1', decode(repeat('00', 32), 'hex'), 'primary'
              ) ON CONFLICT (key_version) DO NOTHING
            `;
            console.log("Verified scoring HMAC keyring versions in isolated database");
          } finally {
            await sql.end({ timeout: 2 });
          }
          NODE

      - name: Verify deployed API exact SHA and dependencies
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          async function fetchWithRetry(url, label, maxAttempts = 5) {
            let lastError;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(30000) });
                if (res.ok) return await res.json();
                lastError = new Error(`${label} returned HTTP ${res.status}`);
              } catch (err) {
                lastError = err;
              }
              if (attempt < maxAttempts) {
                console.log(`Retrying ${label} (attempt ${attempt}/${maxAttempts})...`);
                await new Promise((r) => setTimeout(r, 2000 * attempt));
              }
            }
            throw lastError;
          }

          const meta = await fetchWithRetry(`${base}/api/v1/meta/build`, "Build metadata");
          if (meta.git_sha !== process.env.CANDIDATE_SHA) {
            throw new Error(`Deployed SHA mismatch: expected ${process.env.CANDIDATE_SHA}, got ${meta.git_sha}`);
          }
          if (meta.environment !== "staging") {
            throw new Error(`Gate D requires environment=staging; got ${meta.environment}`);
          }

          const ready = await fetchWithRetry(`${base}/health/ready`, "Readiness");
          if (!ready.dependencies?.database || !ready.dependencies?.redis || !ready.dependencies?.queue) {
            throw new Error(`Health dependencies not satisfied: ${JSON.stringify(ready)}`);
          }
          console.log(`Verified deployed staging SHA ${meta.git_sha} with database/redis/queue healthy`);
          NODE

      - name: Build workspace packages
        run: pnpm build

      - name: Validate migration compatibility against Gate D database
        env:
          APP_ENV: test
        run: pnpm db:migrate:check

      - name: Apply candidate migrations to isolated Gate D database
        env:
          APP_ENV: test
        run: pnpm db:migrate

      - name: Seed canonical Gate D pilot fixture
        run: pnpm seed:staging:pilot

      - name: Locate single-use scoring handoff
        id: scoring-handoff
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$TMPDIR" -maxdepth 2 -type f -path "$TMPDIR/matchday-gate-d-scoring-*/scorekeeper-access.json" -print)
          test "${#files[@]}" -eq 1
          secret_file="${files[0]}"
          perms="$(stat -c '%a' "$secret_file" 2>/dev/null || stat -f '%Lp' "$secret_file")"
          test "$perms" = "600"
          case "$secret_file" in
            "$TMPDIR"/matchday-gate-d-scoring-*/scorekeeper-access.json) ;;
            *) echo 'Scoring handoff escaped runner-owned Gate D temp root' >&2; exit 1 ;;
          esac
          printf 'secret_file=%s\n' "$secret_file" >> "$GITHUB_OUTPUT"
          printf 'secret_dir=%s\n' "$(dirname "$secret_file")" >> "$GITHUB_OUTPUT"

      - name: Run QA-010 public projection staging load
        run: pnpm test:load:public -- --mode=staging

      - name: Prove QA-011 harness is the frozen candidate version
        run: |
          set -euo pipefail
          expected_blob="$(git rev-parse "$CANDIDATE_SHA:apps/api/scripts/run-load-scoring.ts")"
          actual_blob="$(git hash-object apps/api/scripts/run-load-scoring.ts)"
          test "$actual_blob" = "$expected_blob"
          git diff --exit-code -- apps/api/scripts/run-load-scoring.ts
          echo "Verified QA-011 harness blob $actual_blob from frozen candidate"

      - name: Run unmodified QA-011 scoring and result propagation staging load
        env:
          GATE_D_SCORING_SECRET_FILE: ${{ steps.scoring-handoff.outputs.secret_file }}
        run: pnpm test:load:scoring -- --mode=staging

      - name: Prove one-time scoring handoff was destroyed
        if: ${{ always() && steps.scoring-handoff.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -e '${{ steps.scoring-handoff.outputs.secret_file }}'
          test ! -d '${{ steps.scoring-handoff.outputs.secret_dir }}'

      - name: Prove QA-011 harness remained unchanged
        if: ${{ always() }}
        run: |
          set -euo pipefail
          expected_blob="$(git rev-parse "$CANDIDATE_SHA:apps/api/scripts/run-load-scoring.ts")"
          actual_blob="$(git hash-object apps/api/scripts/run-load-scoring.ts)"
          test "$actual_blob" = "$expected_blob"
          git diff --exit-code -- apps/api/scripts/run-load-scoring.ts

      - name: Verify all Gate D staging receipts
        run: pnpm evidence:gate-d:verify "$CANDIDATE_SHA"

      - name: Prove qualification did not mutate tracked source
        run: git diff --exit-code

      - name: Unconditionally destroy runner-owned Gate D temp data
        if: ${{ always() }}
        run: |
          set +e
          secret_file='${{ steps.scoring-handoff.outputs.secret_file }}'
          secret_dir='${{ steps.scoring-handoff.outputs.secret_dir }}'
          if [ -n "$secret_file" ]; then rm -f -- "$secret_file"; fi
          if [ -n "$secret_dir" ]; then rm -rf -- "$secret_dir"; fi
          if [ -n "${TMPDIR:-}" ] && [[ "$TMPDIR" == "$RUNNER_TEMP"/matchday-gate-d-runtime-* ]]; then
            rm -rf -- "$TMPDIR"
          fi

      - name: Retain non-secret Gate D staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-d-staging-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/staging-pilot-seed.json
            artifacts/qa-010-load-public-summary.json
            artifacts/qa-011-load-scoring-summary.json
            artifacts/qa-011-result-propagation-summary.json
          if-no-files-found: warn
          retention-days: 90
