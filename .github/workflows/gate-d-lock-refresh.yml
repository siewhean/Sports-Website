name: Gate D lock refresh

on:
  push:
    branches: [phase-7/release-hardening]

permissions:
  contents: write

concurrency:
  group: gate-d-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase-7/release-hardening
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Patch fast-uri overrides and regenerate lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const overrides = pkg.pnpm?.overrides;
          if (!overrides) throw new Error('package.json pnpm.overrides is missing');
          overrides['@fastify/ajv-compiler>fast-uri'] = '3.1.6';
          overrides['fast-uri@3.1.4'] = '3.1.6';
          overrides['fast-json-stringify>fast-uri'] = '4.1.3';
          overrides['json-schema-resolver>fast-uri'] = '3.1.6';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only
          pnpm audit --prod --audit-level moderate
      - name: Commit generated dependency fix
        run: |
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already patched; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): patch fast-uri advisories'
          git push origin HEAD:phase-7/release-hardening
