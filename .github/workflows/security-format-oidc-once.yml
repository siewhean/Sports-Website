name: Security Format OIDC Once

on:
  pull_request:
    branches:
      - v1/simple-working-product
    paths:
      - .github/workflows/security-format-oidc-once.yml

permissions:
  contents: write

jobs:
  format-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format OIDC assurance provider
        run: pnpm exec prettier --write apps/api/src/oidc-provider.ts
      - name: Commit only OIDC formatting
        run: |
          if git diff --quiet -- apps/api/src/oidc-provider.ts; then
            echo "OIDC provider is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/oidc-provider.ts
          git commit -m "style(auth): format OIDC assurance provider"
          git push origin HEAD:${GITHUB_HEAD_REF}
