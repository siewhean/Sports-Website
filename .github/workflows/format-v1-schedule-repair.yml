name: Format V1 Schedule Repair
on:
  push:
    branches: [fix/v1-tight-capacity-scheduler-results-publish]
    paths: [.github/workflows/format-v1-schedule-repair.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/domain/src/schedule-constraints.ts
          packages/domain/tests/v1-tight-capacity-schedule.test.ts
          apps/api/src/phase-4-runtime.ts
          apps/api/tests/integration/phase-4-runtime.test.ts
          apps/scheduler/tests/unit/domain-optimizer.test.ts
          apps/web/app/api/phase4/competitions/[competitionId]/schedule/jobs/route.ts
          apps/web/app/organiser/competitions/[id]/[section]/page.tsx
          apps/web/components/phase3/V1ResultsWorkspace.tsx
          apps/web/components/phase4/schedule/ScheduleWorkspace.tsx
          apps/web/components/phase4/schedule/V1ScheduleWorkspace.tsx
          apps/web/components/phase4/schedule/V1PublishWorkspace.tsx
          apps/web/lib/v1-publication-readiness.ts
          apps/web/lib/v1-publication-readiness.test.ts
          apps/web/lib/v1-schedule-production.ts
      - run: git rm .github/workflows/format-v1-schedule-repair.yml
      - run: |
          git config user.name matchday-v1-bot
          git config user.email 65327039+siewhean@users.noreply.github.com
          git add apps packages .github/workflows
          git diff --cached --check
          git commit -m "style(v1): format schedule results publish repair"
          git push origin HEAD:fix/v1-tight-capacity-scheduler-results-publish
