name: PR32 Format Preview

on:
  push:
    branches:
      - fix/v1-format-direct-readiness

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/lib/v1-format-readiness.ts apps/web/lib/v1-format-readiness.test.ts
      - run: git diff -- apps/web/lib/v1-format-readiness.ts apps/web/lib/v1-format-readiness.test.ts
