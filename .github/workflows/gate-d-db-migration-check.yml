name: Gate D database migration check

on:
  push:
    branches: [gate-d/diagnostics-f1a82186]

permissions:
  contents: read

jobs:
  migration-check:
    runs-on: ubuntu-latest
    environment: gate-d-controlled-staging
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.GATE_D_DATABASE_URL }}
      CANDIDATE_SHA: f1a8218616f51197a22fe218306ae6f7a908efca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove frozen candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build config dependency
        run: pnpm --filter @matchday/config build
      - name: Verify isolated migration compatibility
        run: pnpm db:migrate:check
