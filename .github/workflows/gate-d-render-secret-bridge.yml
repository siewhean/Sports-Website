name: Gate D sealed Render database bridge

on:
  push:
    branches: [gate-d/control-f1a82186]
    paths:
      - .github/workflows/gate-d-render-secret-bridge.yml
      - .github/gate-d/render-db-url.sealed.json
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gate-d-render-secret-bridge
  cancel-in-progress: false

jobs:
  render-db-bridge:
    name: Securely wire Gate D database into Render
    runs-on: ubuntu-latest
    environment: gate-d-controlled-staging
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: f1a8218616f51197a22fe218306ae6f7a908efca
      RENDER_SERVICE_ID: srv-dabbmk2jobas73c0de20
      TARGET_URL: https://c5-drill.poladex.shop
      EXPECTED_DB_HOST: ep-raspy-mud-a1og3bh8-pooler.ap-southeast-1.aws.neon.tech
      EXPECTED_DB_ROLE: gate_d_runtime
      EXPECTED_DB_NAME: neondb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gate-d/control-f1a82186
          fetch-depth: 0
          persist-credentials: false

      - name: Prove frozen product candidate is unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase-7/release-hardening
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"

      - name: Publish bridge key or decrypt sealed database URL
        id: bridge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            createHash,
            createPrivateKey,
            createPublicKey,
            diffieHellman,
            hkdfSync,
            createDecipheriv,
          } from "node:crypto";

          const context = "matchday-gate-d-render-bridge-v1";
          const seed = createHash("sha256")
            .update(context)
            .update("\0")
            .update(process.env.RENDER_API_KEY)
            .digest();

          const privateKey = createPrivateKey({
            key: Buffer.concat([
              Buffer.from("302e020100300506032b656e04220420", "hex"),
              seed,
            ]),
            format: "der",
            type: "pkcs8",
          });
          const publicDer = createPublicKey(privateKey).export({ format: "der", type: "spki" });
          const publicRaw = Buffer.from(publicDer).subarray(-32);
          console.log(`BRIDGE_PUBLIC_KEY_B64=${publicRaw.toString("base64")}`);

          const payloadPath = ".github/gate-d/render-db-url.sealed.json";
          if (!fs.existsSync(payloadPath)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_payload=false\n");
            console.log("No sealed payload present; bridge public key published only");
            process.exit(0);
          }

          const payload = JSON.parse(fs.readFileSync(payloadPath, "utf8"));
          for (const key of ["ephemeral_public_key_b64", "iv_b64", "tag_b64", "ciphertext_b64"]) {
            if (typeof payload[key] !== "string" || !payload[key]) throw new Error(`sealed payload missing ${key}`);
          }

          const ephemeralRaw = Buffer.from(payload.ephemeral_public_key_b64, "base64");
          if (ephemeralRaw.length !== 32) throw new Error("invalid ephemeral X25519 public key length");
          const ephemeralPublicKey = createPublicKey({
            key: Buffer.concat([
              Buffer.from("302a300506032b656e032100", "hex"),
              ephemeralRaw,
            ]),
            format: "der",
            type: "spki",
          });

          const shared = diffieHellman({ privateKey, publicKey: ephemeralPublicKey });
          const key = Buffer.from(hkdfSync(
            "sha256",
            shared,
            Buffer.alloc(0),
            Buffer.from("matchday-gate-d-render-db-v1"),
            32,
          ));
          const iv = Buffer.from(payload.iv_b64, "base64");
          const tag = Buffer.from(payload.tag_b64, "base64");
          const ciphertext = Buffer.from(payload.ciphertext_b64, "base64");
          if (iv.length !== 12 || tag.length !== 16 || ciphertext.length < 32) {
            throw new Error("invalid sealed payload dimensions");
          }

          const decipher = createDecipheriv("aes-256-gcm", key, iv);
          decipher.setAuthTag(tag);
          const plaintext = Buffer.concat([decipher.update(ciphertext), decipher.final()]).toString("utf8");
          const url = new URL(plaintext);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) throw new Error("decrypted payload is not PostgreSQL");
          if (url.hostname !== process.env.EXPECTED_DB_HOST) throw new Error(`unexpected Gate D database host ${url.hostname}`);
          if (decodeURIComponent(url.username) !== process.env.EXPECTED_DB_ROLE) throw new Error("unexpected Gate D database role");
          if (url.pathname !== `/${process.env.EXPECTED_DB_NAME}`) throw new Error("unexpected Gate D database name");
          if (!url.password) throw new Error("Gate D database payload has no password");

          console.log(`::add-mask::${plaintext}`);
          console.log(`::add-mask::${url.password}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `REPLACEMENT_DATABASE_URL=${plaintext}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_payload=true\n");
          console.log("Sealed Gate D database payload decrypted and validated in runner memory");
          NODE

      - name: Verify replacement database authentication and migration ledger
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gate-d-pgcheck-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$work"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --silent postgres@3.4.9
          DATABASE_URL="${REPLACEMENT_DATABASE_URL//-pooler/}" node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { ssl: "require", max: 1, connect_timeout: 10 });
          try {
            const rows = await sql`
              select count(*)::int as migration_count,
                     min(name) as first_migration,
                     max(name) as last_migration
              from schema_migrations
            `;
            const row = rows[0];
            if (row.migration_count !== 61 ||
                row.first_migration !== "0001_foundation.sql" ||
                row.last_migration !== "0061_phase6_reject_organisation_event_pass.sql") {
              throw new Error(`replacement database migration mismatch: ${JSON.stringify(row)}`);
            }
            console.log("Verified replacement database: 61 migrations through 0061");
          } finally {
            await sql.end({ timeout: 2 });
          }
          NODE
          cd "$GITHUB_WORKSPACE"
          rm -rf -- "$work"

      - name: Update only Gate D Render DATABASE_URL
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          test -n "$REPLACEMENT_DATABASE_URL"
          payload="$(REPLACEMENT_DATABASE_URL="$REPLACEMENT_DATABASE_URL" node -e 'process.stdout.write(JSON.stringify({value: process.env.REPLACEMENT_DATABASE_URL}))')"
          curl --fail --silent --show-error -X PUT \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/DATABASE_URL" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
          echo "Updated only the Gate D Render DATABASE_URL from sealed runner memory"

      - name: Redeploy exact Gate D Render service
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')"
          deploy_id="$(printf '%s' "$response" | node -e '
            let raw=""; process.stdin.on("data",c=>raw+=c); process.stdin.on("end",()=>{
              const j=JSON.parse(raw); const id=j.id||j.deploy?.id; if(!id) process.exit(2); process.stdout.write(id);
            });
          ')"
          echo "Triggered Gate D deploy $deploy_id"

          for attempt in $(seq 1 120); do
            status_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(printf '%s' "$status_json" | node -e '
              let raw=""; process.stdin.on("data",c=>raw+=c); process.stdin.on("end",()=>{
                const j=JSON.parse(raw); process.stdout.write(j.status||j.deploy?.status||"unknown");
              });
            ')"
            echo "Deploy status: $status ($attempt/120)"
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            if [ "$attempt" -eq 120 ]; then echo "Timed out waiting for Gate D deploy" >&2; exit 1; fi
            sleep 5
          done

      - name: Verify controlled endpoint exact SHA and readiness
        if: ${{ steps.bridge.outputs.has_payload == 'true' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          let meta, ready;
          for (let attempt = 1; attempt <= 36; attempt++) {
            try {
              const metaRes = await fetch(`${base}/api/v1/meta/build`, { signal: AbortSignal.timeout(15000) });
              const readyRes = await fetch(`${base}/health/ready`, { signal: AbortSignal.timeout(15000) });
              if (metaRes.ok && readyRes.ok) {
                const nextMeta = await metaRes.json();
                const nextReady = await readyRes.json();
                if (nextMeta.git_sha === process.env.CANDIDATE_SHA &&
                    nextMeta.environment === "staging" &&
                    nextReady.dependencies?.database &&
                    nextReady.dependencies?.redis &&
                    nextReady.dependencies?.queue) {
                  meta = nextMeta;
                  ready = nextReady;
                  break;
                }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!meta || !ready) throw new Error("controlled endpoint did not become exact-SHA healthy after sealed remediation");
          console.log(`Verified controlled staging endpoint on ${meta.git_sha}: database/redis/queue healthy`);
          NODE
