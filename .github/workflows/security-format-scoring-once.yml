name: Security Format Scoring Once

on:
  pull_request:
    branches:
      - v1/simple-working-product
    paths:
      - .github/workflows/security-format-scoring-once.yml

permissions:
  contents: write

jobs:
  format-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format scoring security files
        run: >-
          pnpm exec prettier --write
          apps/api/src/app.ts
          apps/api/src/main.ts
          apps/api/src/scoring-rate-limit-identity.ts
          apps/api/tests/integration/rate-limit-redis.test.ts
          apps/api/tests/unit/scoring-rate-limit-identity.test.ts
      - name: Commit only scoring security formatting
        run: |
          if git diff --quiet -- \
            apps/api/src/app.ts \
            apps/api/src/main.ts \
            apps/api/src/scoring-rate-limit-identity.ts \
            apps/api/tests/integration/rate-limit-redis.test.ts \
            apps/api/tests/unit/scoring-rate-limit-identity.test.ts; then
            echo "Scoring security slice already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/app.ts \
            apps/api/src/main.ts \
            apps/api/src/scoring-rate-limit-identity.ts \
            apps/api/tests/integration/rate-limit-redis.test.ts \
            apps/api/tests/unit/scoring-rate-limit-identity.test.ts
          git commit -m "style(scoring): format security rate-limit slice"
          git push origin HEAD:${GITHUB_HEAD_REF}
