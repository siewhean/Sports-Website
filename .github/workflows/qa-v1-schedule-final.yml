name: QA V1 Schedule Final
on:
  push:
    branches: [qa/v1-schedule-final-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PHASE4_E2E_JOURNEY: v1-competition
      PHASE4_E2E_PLAYWRIGHT_CONFIG: playwright.v1-schedule-final.config.ts
      PHASE4_E2E_PROJECT: phase-4-real-desktop-chromium
      PHASE4_E2E_RUNS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matchday/api... build
      - run: pnpm --filter @matchday/web exec playwright install --with-deps chromium
      - name: Run real-stack exact-capacity browser journey
        run: pnpm --filter @matchday/api exec tsx scripts/run-phase-4-real-e2e.ts
