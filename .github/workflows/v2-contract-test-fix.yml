name: V2 Contract Test Fix

on:
  push:
    branches: [v2/architecture-refinement]
    paths:
      - ".github/workflows/v2-contract-test-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v2/architecture-refinement
          fetch-depth: 0
      - name: Apply exact typed-error contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path("apps/api/tests/integration/phase-4-gate-b-runtime.test.ts")
          text = gate.read_text()

          replacements = [
              (
                  ').rejects.toMatchObject({ statusCode: 403, code: "ACCESS_DENIED" });',
                  ').rejects.toMatchObject({ statusCode: 404, code: "COMPETITION_ACCESS_DENIED" });',
                  1,
              ),
              (
                  'await expect(denied).rejects.toMatchObject({ statusCode: 403 });',
                  'await expect(denied).rejects.toMatchObject({ statusCode: 404, code: "COMPETITION_ACCESS_DENIED" });',
                  1,
              ),
              (
                  ').rejects.toMatchObject({ statusCode: 403 });',
                  ').rejects.toMatchObject({ statusCode: 404, code: "COMPETITION_ACCESS_DENIED" });',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Gate B replacement count mismatch for {old!r}: expected {expected}, got {actual}")
              text = text.replace(old, new)
          gate.write_text(text)

          phase4 = Path("apps/api/tests/integration/phase-4-runtime.test.ts")
          text = phase4.read_text()
          replacements = [
              (
                  ').rejects.toMatchObject({ code: "23505" });',
                  ').rejects.toMatchObject({ statusCode: 409, code: "REVISION_CONFLICT" });',
                  1,
              ),
              (
                  ').rejects.toMatchObject({ code: "ACCESS_DENIED", statusCode: 403 });',
                  ').rejects.toMatchObject({ code: "COMPETITION_ACCESS_DENIED", statusCode: 404 });',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Phase 4 replacement count mismatch for {old!r}: expected {expected}, got {actual}")
              text = text.replace(old, new)
          phase4.write_text(text)
          PY
          git diff --check
      - name: Commit scoped test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/tests/integration/phase-4-gate-b-runtime.test.ts apps/api/tests/integration/phase-4-runtime.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "test(arch): align integration assertions with typed errors"
          git push origin HEAD:v2/architecture-refinement
