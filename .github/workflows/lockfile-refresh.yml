name: Lockfile Refresh

on:
  pull_request:
    branches:
      - v1/simple-working-product
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Generate lockfile from committed manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security(deps): refresh final fast-uri lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}
