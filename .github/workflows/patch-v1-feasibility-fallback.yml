name: Patch V1 Feasibility Fallback

on:
  push:
    branches:
      - fix/v1-tight-capacity-scheduler-results-publish
    paths:
      - .github/workflows/patch-v1-feasibility-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply bounded feasibility fallback
        run: python scripts/tmp-v1-feasibility-fallback.py
      - name: Format domain source
        run: pnpm exec prettier --write packages/domain/src/schedule-constraints.ts
      - name: Remove temporary patch tooling
        run: |
          git rm -f scripts/tmp-v1-feasibility-fallback.py
          git rm -f .github/workflows/patch-v1-feasibility-fallback.yml
      - name: Commit source change
        run: |
          git config user.name "matchday-v1-bot"
          git config user.email "65327039+siewhean@users.noreply.github.com"
          git add packages/domain/src/schedule-constraints.ts scripts .github/workflows
          git diff --cached --check
          git commit -m "fix(scheduler): add bounded exact-capacity feasibility fallback"
          git push origin HEAD:fix/v1-tight-capacity-scheduler-results-publish
