name: Gate C external closure

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA at integration/gate-c-final
        required: true
        type: string
      run_c2:
        description: Run the controlled-staging C2 migration-lock observation
        required: true
        default: true
        type: boolean
      run_c5:
        description: Run the controlled-staging C5 workload/fault/HMAC certification
        required: true
        default: true
        type: boolean
      verify_vercel:
        description: Capture live exact-SHA Vercel READY evidence
        required: true
        default: true
        type: boolean
      vercel_deployment_id:
        description: Optional exact dpl_* to require during provider verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gate-c-external-closure
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  c2-staging:
    name: C2 controlled staging
    runs-on: [self-hosted, linux, x64, gate-c-staging]
    environment: gate-c-controlled-staging
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove immutable candidate checkout
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin integration/gate-c-final
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ inputs.run_c2 }}
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        if: ${{ inputs.run_c2 }}
        run: npm install --global pnpm@10.33.0
      - name: Frozen install
        if: ${{ inputs.run_c2 }}
        run: pnpm install --frozen-lockfile
      - name: Run representative migration-lock observation
        if: ${{ inputs.run_c2 }}
        env:
          GATE_C_C2_CONTROLLED_STAGING: "1"
          DATABASE_URL: ${{ secrets.GATE_C_C2_DATABASE_URL }}
          GATE_C_C2_FIXTURE_COMPETITIONS: "3"
          GATE_C_C2_FIXTURE_DIVISIONS_PER_COMPETITION: "2"
          GATE_C_C2_FIXTURE_MATCHES_PER_DIVISION: "12"
          GATE_C_C2_FIXTURE_SCORE_EVENTS_PER_MATCH: "16"
          GATE_C_C2_FIXTURE_SCORING_SESSIONS_PER_MATCH: "1"
          GATE_C_C2_FIXTURE_RESULT_CONFLICTS_PER_COMPETITION: "2"
        run: pnpm --filter @matchday/database exec tsx scripts/benchmark-migration-locks.ts
      - name: Prove staging run did not mutate tracked source
        if: ${{ inputs.run_c2 }}
        run: git diff --exit-code
      - name: Retain C2 observation
        if: ${{ always() && inputs.run_c2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-c-c2-${{ inputs.candidate_sha }}
          path: artifacts/qa/gate-c-c2/${{ inputs.candidate_sha }}/
          if-no-files-found: warn
          retention-days: 30

  c5-staging:
    name: C5 controlled staging
    needs: [c2-staging]
    runs-on: [self-hosted, linux, x64, gate-c-staging]
    environment: gate-c-controlled-staging
    timeout-minutes: 150
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove immutable candidate checkout
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin integration/gate-c-final
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ inputs.run_c5 }}
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        if: ${{ inputs.run_c5 }}
        run: npm install --global pnpm@10.33.0
      - name: Frozen install
        if: ${{ inputs.run_c5 }}
        run: pnpm install --frozen-lockfile
      - name: Validate staging orchestration contract
        if: ${{ inputs.run_c5 }}
        run: node --test scripts/check-source-contract.test.mjs
      - name: Run real C5 staging workload, faults, and HMAC lifecycle
        if: ${{ inputs.run_c5 }}
        env:
          GATE_C_C5_STAGING_OPT_IN: "1"
          GATE_C_C5_IDENTITY_BEARER_TOKEN: ${{ secrets.GATE_C_C5_IDENTITY_BEARER_TOKEN }}
          GATE_C_C5_COMPONENT_ATTESTATION_HMAC_SECRET: ${{ secrets.GATE_C_C5_COMPONENT_ATTESTATION_HMAC_SECRET }}
          GATE_C_C5_FAULT_ATTESTATION_HMAC_SECRET: ${{ secrets.GATE_C_C5_FAULT_ATTESTATION_HMAC_SECRET }}
          GATE_C_C5_DEPLOYMENT_ID: ${{ vars.GATE_C_C5_DEPLOYMENT_ID }}
          GATE_C_C5_BUILD_ID: ${{ vars.GATE_C_C5_BUILD_ID }}
          GATE_C_C5_API_PROBE_URL: ${{ vars.GATE_C_C5_API_PROBE_URL }}
          GATE_C_C5_WEB_PROBE_URL: ${{ vars.GATE_C_C5_WEB_PROBE_URL }}
          GATE_C_C5_WORKER_PROBE_URL: ${{ vars.GATE_C_C5_WORKER_PROBE_URL }}
          GATE_C_C5_IDENTITY_PROBE_URL: ${{ vars.GATE_C_C5_IDENTITY_PROBE_URL }}
          GATE_C_C5_POSTGRES_IDENTIFIER: ${{ vars.GATE_C_C5_POSTGRES_IDENTIFIER }}
          GATE_C_C5_REDIS_NAMESPACE: ${{ vars.GATE_C_C5_REDIS_NAMESPACE }}
          GATE_C_C5_SCORE_EVENT_ACK_ENDPOINT: ${{ vars.GATE_C_C5_SCORE_EVENT_ACK_ENDPOINT }}
          GATE_C_C5_PUBLIC_CURRENT_ENDPOINT: ${{ vars.GATE_C_C5_PUBLIC_CURRENT_ENDPOINT }}
          GATE_C_C5_PUBLIC_CONVERGENCE_ENDPOINT: ${{ vars.GATE_C_C5_PUBLIC_CONVERGENCE_ENDPOINT }}
          GATE_C_C5_LEASE_TAKEOVER_ENDPOINT: ${{ vars.GATE_C_C5_LEASE_TAKEOVER_ENDPOINT }}
          GATE_C_C5_REPAIR_PUBLICATION_ENDPOINT: ${{ vars.GATE_C_C5_REPAIR_PUBLICATION_ENDPOINT }}
          GATE_C_C5_WORKLOAD_PROFILE_JSON: ${{ vars.GATE_C_C5_WORKLOAD_PROFILE_JSON }}
          GATE_C_C5_MINIMUM_SAMPLES: "500"
          GATE_C_C5_MAXIMUM_SAMPLES: "1000000"
          GATE_C_C5_OPERATION_TIMEOUT_MS: "30000"
          GATE_C_C5_FAULT_COMMANDS_JSON: ${{ secrets.GATE_C_C5_FAULT_COMMANDS_JSON }}
          GATE_C_C5_HMAC_DRILL_OPT_IN: "1"
          GATE_C_C5_HMAC_CONTROL_PLANE_URL: ${{ vars.GATE_C_C5_HMAC_CONTROL_PLANE_URL }}
          GATE_C_C5_HMAC_OPERATOR_TOKEN: ${{ secrets.GATE_C_C5_HMAC_OPERATOR_TOKEN }}
          GATE_C_C5_HMAC_DRILL_RUNNER: ${{ vars.GATE_C_C5_HMAC_DRILL_RUNNER }}
        run: node scripts/run-gate-c-c5-from-manifest.mjs
      - name: Prove staging run did not mutate tracked source
        if: ${{ inputs.run_c5 }}
        run: git diff --exit-code
      - name: Retain C5 certification evidence
        if: ${{ always() && inputs.run_c5 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-c-c5-${{ inputs.candidate_sha }}
          path: artifacts/qa/gate-c-c5/${{ inputs.candidate_sha }}/
          if-no-files-found: warn
          retention-days: 30

  vercel-proof:
    name: Vercel exact-SHA proof
    needs: [c2-staging, c5-staging]
    if: ${{ always() && inputs.verify_vercel }}
    runs-on: ubuntu-latest
    environment: gate-c-controlled-staging
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_3y6T5b9aTxy1o6PbpGeK2vGiTkMk
      VERCEL_TEAM_ID: team_EqEVvtYJl1XlrsIvRj266qnq
      VERCEL_DEPLOYMENT_ID: ${{ inputs.vercel_deployment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove immutable candidate checkout
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin integration/gate-c-final
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Verify live Vercel provider evidence
        run: |
          args=("--sha=$CANDIDATE_SHA")
          if [ -n "$VERCEL_DEPLOYMENT_ID" ]; then args+=("--deployment-id=$VERCEL_DEPLOYMENT_ID"); fi
          node scripts/verify-vercel-deployment.mjs "${args[@]}"
      - name: Retain Vercel provider response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-c-vercel-${{ inputs.candidate_sha }}
          path: artifacts/qa/deployment/vercel-response.json
          if-no-files-found: error
          retention-days: 30
