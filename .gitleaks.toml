[extend]
useDefault = true

[allowlist]
description = "Generated artifacts and exact non-secret test fixtures"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)dist/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
  '''(^|/)\.env$''',
  '''sports_competition_platform_implementation_plan\.md$'''
]
regexes = [
  '''^\.p2-organiser$''',
  '''^redacted$''',
  '''^abc\.def$''',
  '''^leaked\.secret$''',
  '''^user:password$''',
  '''^postgres://user:password@localhost/db$''',
  '''^raw-value$''',
  '''^Zm9vOmJhcg==$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJzY29yZXIifQ\.signature123$''',
  '''^-----BEGIN PRIVATE KEY-----$'''
]
