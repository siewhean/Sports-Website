receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/betterstack:
    filename: /run/secrets/betterstack-source-token

exporters:
  otlphttp/betterstack:
    endpoint: ${env:BETTERSTACK_OTLP_ENDPOINT}
    compression: gzip
    auth:
      authenticator: bearertokenauth/betterstack

service:
  extensions: [health_check, bearertokenauth/betterstack]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/betterstack]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/betterstack]
