name: matchday-prod

# Application images (api, web, worker, migrate) are built and pushed to GHCR by CI and pulled by
# deploy-prod.sh by exact-SHA tag. The build: blocks remain only for `deploy-prod.sh --build-locally`.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    profiles: [observability]
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    environment:
      OTEL_COLLECTOR_EXTERNAL_ENDPOINT: ${OTEL_COLLECTOR_EXTERNAL_ENDPOINT:-}
      GOMEMLIMIT: 192MiB
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - type: bind
        source: ./otel-collector.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
      - type: bind
        source: /etc/matchday/secrets/otel-bearer-token
        target: /run/secrets/otel-bearer-token
        read_only: true
        bind:
          create_host_path: false
    networks:
      backend:
        ipv4_address: 172.31.0.14

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - matchday-prod-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      backend:
        ipv4_address: 172.31.0.2

  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - matchday-prod-redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      backend:
        ipv4_address: 172.31.0.3

  migrate:
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-migrate:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: migrate
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    env_file: ${OCI_PROD_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EDGE_CACHE_PURGE_BEARER_TOKEN: ""
      EDGE_CACHE_PURGE_ENDPOINT: ""
      SCORING_SESSION_SEAL_KEY: ""
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backend:
        ipv4_address: 172.31.0.4
    profiles: [migration]

  api:
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-api:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: api
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    env_file: ${OCI_PROD_ENV_FILE:-.env.prod}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      GIT_SHA: ${CANDIDATE_SHA}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["4000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/live').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.31.0.11
        aliases:
          - prod-api
          - matchday-prod-api

  web:
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-web:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: web
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
        MATCHDAY_PUBLIC_ORIGIN: ${MATCHDAY_PUBLIC_ORIGIN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    environment:
      APP_ENV: ${APP_ENV}
      NODE_ENV: production
      PORT: 3000
      # Sentry stays off while these are blank. api/worker receive SENTRY_DSN via env_file.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      MATCHDAY_PUBLIC_ORIGIN: ${MATCHDAY_PUBLIC_ORIGIN}
      MATCHDAY_API_BASE_URL: https://${OCI_PUBLIC_HOSTNAME}
      SCORING_SESSION_SEAL_KEY: ${SCORING_SESSION_SEAL_KEY}
      # Signs the end-user IP on BFF->API calls; must equal the API's value (.env.prod).
      MATCHDAY_CLIENT_IP_SECRET: ${MATCHDAY_CLIENT_IP_SECRET:?MATCHDAY_CLIENT_IP_SECRET is required}
      # Caddy is the only ingress; the right-most X-Forwarded-For hop is Caddy's.
      MATCHDAY_CLIENT_IP_SOURCE: proxy
    # Resolve the public hostname to Caddy on the internal bridge so BFF->API
    # calls keep a valid TLS name and Caddy's blue/green routing, but never
    # hairpin through the VM's public NAT (extra latency, NAT-dependent, and
    # every call arriving from one opaque public address).
    extra_hosts:
      - "${OCI_PUBLIC_HOSTNAME}:172.31.0.10"
    depends_on:
      api: { condition: service_healthy }
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.31.0.12
        aliases:
          - prod-web
          - matchday-prod-web

  api-green:
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-api:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: api
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    env_file: ${OCI_PROD_ENV_FILE:-.env.prod}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      GIT_SHA: ${CANDIDATE_SHA}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["4000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/live').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.31.0.21
        aliases:
          - prod-api-green
          - matchday-prod-api-green

  web-green:
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-web:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: web
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
        MATCHDAY_PUBLIC_ORIGIN: ${MATCHDAY_PUBLIC_ORIGIN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    environment:
      APP_ENV: ${APP_ENV}
      NODE_ENV: production
      PORT: 3000
      # Sentry stays off while these are blank. api/worker receive SENTRY_DSN via env_file.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      MATCHDAY_PUBLIC_ORIGIN: ${MATCHDAY_PUBLIC_ORIGIN}
      MATCHDAY_API_BASE_URL: https://${OCI_PUBLIC_HOSTNAME}
      SCORING_SESSION_SEAL_KEY: ${SCORING_SESSION_SEAL_KEY}
      # Signs the end-user IP on BFF->API calls; must equal the API's value (.env.prod).
      MATCHDAY_CLIENT_IP_SECRET: ${MATCHDAY_CLIENT_IP_SECRET:?MATCHDAY_CLIENT_IP_SECRET is required}
      # Caddy is the only ingress; the right-most X-Forwarded-For hop is Caddy's.
      MATCHDAY_CLIENT_IP_SOURCE: proxy
    # Resolve the public hostname to Caddy on the internal bridge so BFF->API
    # calls keep a valid TLS name and Caddy's blue/green routing, but never
    # hairpin through the VM's public NAT (extra latency, NAT-dependent, and
    # every call arriving from one opaque public address).
    extra_hosts:
      - "${OCI_PUBLIC_HOSTNAME}:172.31.0.10"
    depends_on:
      api-green: { condition: service_healthy }
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.31.0.22
        aliases:
          - prod-web-green
          - matchday-prod-web-green

  worker:
    stop_grace_period: 70s
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-worker:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: worker
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    env_file: ${OCI_PROD_ENV_FILE:-.env.prod}
    environment:
      GIT_SHA: ${CANDIDATE_SHA}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SCORING_SESSION_SEAL_KEY: ""
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      backend:
        ipv4_address: 172.31.0.13
        aliases:
          - prod-worker
          - matchday-prod-worker

  worker-green:
    stop_grace_period: 70s
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-worker:${CANDIDATE_SHA}
    build:
      context: ../..
      dockerfile: infra/oci/Dockerfile
      target: worker
      args:
        MATCHDAY_BUILD_ID: ${CANDIDATE_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    env_file: ${OCI_PROD_ENV_FILE:-.env.prod}
    environment:
      GIT_SHA: ${CANDIDATE_SHA}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SCORING_SESSION_SEAL_KEY: ""
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      backend:
        ipv4_address: 172.31.0.23
        aliases:
          - prod-worker-green
          - matchday-prod-worker-green

  # One-shot backup/restore tooling (profile `backup`). Scheduled by the host systemd timer in
  # infra/oci/backup/ (docker compose run --rm backup backup); never started by `up`.
  # Image = the digest-pinned Postgres base + bash/curl/age (see infra/oci/backup/Dockerfile).
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    # Built and pushed by CI like the application images. The timer runs without CANDIDATE_SHA, hence :latest (main).
    image: ${MATCHDAY_IMAGE_REGISTRY:-ghcr.io/siewhean}/matchday-backup:${CANDIDATE_SHA:-latest}
    profiles: [backup]
    restart: "no"
    user: "${MATCHDAY_BACKUP_UID:-1000}:${MATCHDAY_BACKUP_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-ap-singapore-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-0}
      BACKUP_RETAIN_DAILY: ${BACKUP_RETAIN_DAILY:-14}
      BACKUP_RETAIN_WEEKLY: ${BACKUP_RETAIN_WEEKLY:-8}
      BACKUP_RETAIN_PREMIGRATION: ${BACKUP_RETAIN_PREMIGRATION:-10}
      BACKUP_MAX_TOTAL_BYTES: ${BACKUP_MAX_TOTAL_BYTES:-16106127360}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    tmpfs:
      - /tmp:size=256m,mode=1777
      # The postgres base image declares this path a VOLUME; keep it from creating anonymous volumes.
      - /var/lib/postgresql:size=1m
    volumes:
      - type: bind
        source: ${MATCHDAY_BACKUP_DIR:-/var/lib/matchday/backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backend:
        ipv4_address: 172.31.0.15

volumes:
  matchday-prod-postgres:
  matchday-prod-redis:

networks:
  backend:
    name: matchday-prod_backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
